# Monik — пример конфигурации.
#
# ВНИМАНИЕ: реальные секреты в этот файл не помещаются никогда.
# Credentials задаются ссылками на environment variables ({ env: "MONIK_..." })
# и разрешаются только Configuration subsystem (17_CONFIGURATION.md §5, §26, §46).
#
# Любой параметр можно переопределить переменной окружения с префиксом MONIK__,
# где путь внутри документа разделяется двойным подчёркиванием. Например:
#   MONIK__SCANNER__LEVEL1__INTERVAL_SECONDS=60
#   MONIK__APPLICATION__ENVIRONMENT=production
# Приоритет: environment override > этот файл > безопасный default.

application:
  environment: development        # development | test | production
  timezone: "Europe/Lisbon"
  shutdown_timeout_seconds: 30

# Сети. Круг всегда замыкается внутри одной сети: межсетевых сделок
# сканер не рассматривает (10_LEVEL_1_SCANNER.md §38). Поэтому базовый
# токен round-trip задаётся здесь, у сети, а не общей настройкой сканера.
# Сеть выключается собственным флагом enabled — тогда она не участвует в
# сканировании вовсе (02_LEVEL1_SCANNER.md §72).
networks:
  - network_id: polygon
    name: Polygon
    chain_id: 137
    native_token_symbol: POL
    native_token_decimals: 18
    wrapped_native_address: "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"
    # Базовый токен круга этой сети: вход и выход цикла.
    base_token_address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
    rpc_url: "https://polygon-bor-rpc.publicnode.com"
    # Запасные узлы. Публичные узлы отказывают — 18.09 основной узел
    # Arbitrum начал отвечать 403 на всё подряд, и подобрать квитанцию
    # уже отправленной покупки стало нечем. Проверены живыми запросами
    # в тот же день.
    rpc_fallback_urls:
      - "https://polygon.drpc.org"
    # Значок сети в уведомлении Telegram.
    emoji: "⛓️"
    enabled: true
    # Надбавка к базовой цене газа. В Polygon за место в блоке идёт торг,
    # и сеть требует не меньше 25 gwei: без надбавки транзакция может не
    # попасть в блок вовсе. Значение то же, что действовало до вынесения
    # надбавки в настройку сети.
    priority_fee_wei: 30000000000

  - network_id: arbitrum
    name: Arbitrum
    chain_id: 42161
    native_token_symbol: ETH
    native_token_decimals: 18
    wrapped_native_address: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
    # USDT на Arbitrum. Адрес другой, чем на Polygon: одинаковый символ
    # не означает одинаковый контракт (01_PROJECT_REQUIREMENTS.md §11).
    base_token_address: "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
    # Официальный узел сети. Прежний (publicnode) 18.09 начал отвечать
    # отказом 403 на все запросы подряд — вплоть до того, что подобрать
    # квитанцию уже отправленной покупки стало нечем.
    rpc_url: "https://arb1.arbitrum.io/rpc"
    rpc_fallback_urls:
      - "https://arbitrum.drpc.org"
      - "https://arbitrum-one.public.blastapi.io"
    emoji: "🪀"
    enabled: true
    # В Arbitrum торга за место в блоке нет: проверка живых блоков 18.09
    # показала, что все транзакции просят надбавку ноль и платят ровно
    # базовую цену — около 0,02 gwei. Надбавка в 30 gwei, действовавшая
    # для Polygon, удорожила бы здесь каждую транзакцию в полторы тысячи
    # раз.
    priority_fee_wei: 0

# Провайдер включается только вместе с заданной переменной окружения
# для его ключа: enabled-провайдер без доступного секрета останавливает старт.
providers:
  - provider_id: oneinch
    enabled: false
    emoji: "🥏"
    ui_url: "https://app.1inch.io"
    supported_networks: [polygon]
    request_timeout_seconds: 10.0
    max_concurrent_requests: 1
    requests_per_second: 0.9

  - provider_id: zero_x
    emoji: "🔫"
    ui_url: "https://matcha.xyz"
    # Отключён: лимит запросов бесплатного плана исчерпан. Проверка
    # 14.09 показала, что он не восстановился — API снова ответил 403.
    # Возврат — по решению оператора, одной строкой.
    enabled: false
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    api_key: { env: "MONIK_ZEROX_API_KEY" }
    requests_per_second: 4.9
    # 0x чаще остальных отвечает ошибкой частоты: за два часа наблюдения
    # 15 повторов против нуля у Velora и Uniswap. Пауза только для него,
    # общая остаётся 0.2 (resources.provider_min_interval_seconds).
    min_interval_seconds: 0.3
    # Часы работы. Вне окна агрегатор не опрашивается вовсе.
    schedule:
      start: "04:00"
      end: "23:00"
    supported_networks: [polygon]

  - provider_id: velora
    # Выключен 19.09: проверка идёт на паре Uniswap + CoW Swap. Velora —
    # маршрутизатор поверх тех же пулов, что и Uniswap, и независимого
    # источника цены не даёт.
    enabled: false
    emoji: "👾"
    ui_url: "https://app.velora.xyz"
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    api_key: { env: "MONIK_VELORA_API_KEY" }
    # Документированный бесплатный тариф Velora — 1 запрос в секунду и
    # 5000 в сутки (velora.xyz/docs/integrate/rate-limits).
    #
    # Прежние 4 запроса в секунду были выставлены, когда Velora работала
    # только в режиме ur с проходом раз в пять минут: расход был низким, и
    # частоту имело смысл проверить опытом. В торговом проходе она стала
    # запрашиваться на два порядка чаще, и запас исчез — частота возвращена
    # к документированной.
    # Три запроса в секунду по решению оператора 18.09. Документированный
    # предел — один; пауза 0,35 с удерживает фактический темп чуть ниже
    # трёх. При отказах 429 предохранитель разведёт пробы по лестнице
    # охлаждения.
    requests_per_second: 3.0
    min_interval_seconds: 0.35
    # Часы работы. Короткое окно бережёт суточную квоту бесплатного
    # тарифа: за 12 часов расход вдвое меньше, чем за сутки.
    # Часы работы. Расширены до 23:00 по решению оператора 18.09: при
    # прежних 19:00 торговый проход оставался с одним агрегатором уже
    # вечером, и кросс-агрегаторные круги не искались вовсе.
    schedule:
      start: "07:00"
      end: "23:00"
    # Основной и торговый режимы. В торговом Velora работает в паре с
    # Uniswap: круг «купил у одного, продал у другого» (решение
    # оператора 18.09). В fest не включена: при интервале в 30 секунд она
    # одна стоила бы 8640 запросов за окно при квоте 5000 в сутки.
    modes: [ur, ann]
    # Только Polygon. API Velora работает и на Arbitrum, но суточная
    # квота бесплатного тарифа — 5000 запросов, а один Polygon уже
    # расходует около 44 за цикл. Вторая сеть удвоила бы расход без
    # запаса. Включение — одной строкой, когда появится платный тариф.
    supported_networks: [polygon]
    options:
      # Адрес, от имени которого собирается транзакция: это торговый счёт
      # режима ann, и calldata строится под него.
      swapper: "0xc6fb9692Fff871e1b4874E8Dc0620fd77CE02390"

  - provider_id: kyberswap
    # Выключен по решению оператора 18.09. Причина измерена в тот же день:
    # котировка обещает больше, чем агрегатор предлагает, а предложение —
    # больше, чем отдают пулы. Цепь дважды отвергла его сделку с ответом
    # «Return amount is not enough», то есть роутер не смог исполнить даже
    # собственный зашитый минимум.
    enabled: false
    modes: [ur, fest, ann]
    emoji: "🖲️"
    ui_url: "https://kyberswap.com/swap/"
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    # Ключ доступа API не требует. Значение передаётся заголовком
    # x-client-id, которым приложение называет себя; на цену и на лимит
    # частоты оно не влияет — как X-Partner у Velora.
    api_key: { env: "MONIK_KYBERSWAP_API_KEY" }
    # Публичный лимит — 3 запроса в секунду, суточной квоты нет
    # (docs.kyberswap.com, раздел rate limits). Проба с частотой 4 дала 13
    # отказов по лимиту за 23 минуты, поэтому темп возвращён в рамки.
    requests_per_second: 3.0
    min_interval_seconds: 0.35
    # Часы работы. Вне окна агрегатор не опрашивается вовсе.
    schedule:
      start: "04:00"
      end: "23:00"
    supported_networks: [polygon, arbitrum]
    # Сеть зашита в адрес страницы обмена, поэтому общая ссылка привела
    # бы оператора не в ту сеть.
    ui_urls:
      polygon: "https://kyberswap.com/swap/polygon"
      arbitrum: "https://kyberswap.com/swap/arbitrum"
    options:
      # Адрес, от имени которого собирается транзакция. Это торговый счёт
      # режима ann: исполнит её именно он, и calldata собирается под него.
      swapper: "0xc6fb9692Fff871e1b4874E8Dc0620fd77CE02390"

  - provider_id: uniswap
    enabled: true
    # Работает в торговом проходе вместе с KyberSwap: круг «купил у
    # одного, продал у другого» — основная модель арбитража, и для неё
    # в режиме нужны оба (решение оператора 18.09).
    modes: [ur, fest, ann]
    emoji: "🧩"
    ui_url: "https://app.uniswap.org/swap"
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    api_key: { env: "MONIK_UNISWAP_API_KEY" }
    requests_per_second: 4.9
    # Часы работы. Вне окна агрегатор не опрашивается вовсе.
    schedule:
      start: "04:00"
      end: "23:00"
    supported_networks: [polygon, arbitrum]
    ui_urls:
      polygon: "https://app.uniswap.org/swap?chain=polygon"
      arbitrum: "https://app.uniswap.org/swap?chain=arbitrum"
    options:
      # Адрес, от имени которого строится котировка и собирается
      # транзакция. Это торговый счёт режима ann: транзакцию исполнит
      # именно он, и котировка должна быть посчитана для него же.
      swapper: "0xc6fb9692Fff871e1b4874E8Dc0620fd77CE02390"

  - provider_id: cow
    # Шестой агрегатор (the_main_rules.md, правило 16). Включён обратно
    # 19.09: у Velora Delta в Polygon практически нет агентов — за
    # тридцать часов тридцать расчётов на весь протокол, за пять часов
    # наших попыток ни одного, и десять наших заявок не взял никто.
    # У CoW Swap в той же сети около ста десяти расчётов в час.
    # Включён вместе с
    # Uniswap по решению оператора 19.09: источник цены у него свой —
    # заявку исполняет решатель, который может взять её на себя или
    # свести со встречной, — и потому расхождение с пулом у него на
    # порядок больше, чем между маршрутизаторами поверх тех же пулов.
    enabled: true
    # Только торговый проход: в ur и fest он не нужен, а его заявки
    # живут минутами и к частому сканированию отношения не имеют.
    modes: [ann]
    emoji: "🐮"
    ui_url: "https://swap.cow.fi"
    # Круг целиком у одного агрегатора разрешён: смысл пары именно в
    # расхождении между двумя, но и односторонний круг отсекать нечем,
    # кроме результата.
    allow_same_provider_round_trip: true
    # Книга заявок работает без ключа доступа.
    requests_per_second: 4.0
    supported_networks: [polygon]
    ui_urls:
      polygon: "https://swap.cow.fi/#/137/swap"
    options:
      # Адрес, от имени которого составляется и подписывается заявка.
      # Подпись обязана сойтись с полем from, поэтому адрес здесь —
      # именно торговый счёт режима ann.
      swapper: "0xc6fb9692Fff871e1b4874E8Dc0620fd77CE02390"
      # Срок жизни заявки и, вместе с ним, срок резервирования средств:
      # пока заявка жива, её сумма занята. Оператор задал десять секунд,
      # но CoW Swap их не принимает: у протокола свой минимум.
      #
      # Замер 19.09: котировка принимает от 60 секунд, но **отправка
      # заявки проверяет срок заново**, а между сборкой и отправкой
      # уходят секунды. Ровно 60 отвергаются с InsufficientValidTo уже
      # на отправке — так и потерялась сделка #T15. Нужен запас над
      # минимумом, и 120 его даёт.
      order_validity_seconds: "120"

  - provider_id: velora_delta
    # Седьмой агрегатор (the_main_rules.md, правило 18). Интентный
    # продукт Velora: заявку исполняет агент, и цена формируется, а не
    # пересказывается из пулов. Замер 19.09 дал расхождение с Uniswap от
    # -0,025 % до +0,018 % против 0,009 % у обычного маршрутизатора.
    #
    # Выключен 19.09: цена у него своя, но исполнять её в Polygon некому.
    # Замер контракта: тридцать расчётов за тридцать часов на весь
    # протокол, за пять часов наших попыток — ноль. Десять подписанных
    # заявок (#T3-#T12) не взял никто, все вернулись без потерь.
    # В Arbitrum активность впятеро выше, но всё ещё тонкая.
    enabled: false
    modes: [ann]
    emoji: "🜂"
    ui_url: "https://app.velora.xyz"
    allow_same_provider_round_trip: true
    # Ключа не требует. Частота выбрана по тому же основанию, что у CoW:
    # проход стоит восьми запросов, и при тридцатисекундном интервале это
    # 0,27 запроса в секунду.
    requests_per_second: 4.0
    supported_networks: [polygon]
    ui_urls:
      polygon: "https://app.velora.xyz/#/swap?network=polygon"
    options:
      # Адрес, от имени которого составляется и подписывается намерение.
      # Подпись обязана сойтись с полем owner.
      swapper: "0xc6fb9692Fff871e1b4874E8Dc0620fd77CE02390"
      # Срок жизни заявки и, вместе с ним, срок резервирования средств:
      # пока заявка жива, её сумма занята. Десять секунд по решению
      # оператора 19.09. Час по умолчанию запер 100 USDT на сделке #T3 и
      # остановил торговлю целиком.
      order_validity_seconds: "10"

# Token universe. Authoritative metadata живёт в Token Registry, здесь
# задаётся разрешённый набор. decimals указывается явно и не выводится
# из символа (01_PROJECT_REQUIREMENTS.md §10).
tokens:
    # Рабочий набор торгового прохода задан оператором 19.09:
