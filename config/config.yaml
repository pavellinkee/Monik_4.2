  - network_id: arbitrum
    address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
    symbol: USDC
    decimals: 6
    usd_stable: true
    rank: 2

  - network_id: arbitrum
    # Мостовой USDC. Контракт в сети отвечает символом USDC — это
    # косметическое расхождение: идентичность задаёт адрес.
    address: "0xFF970A61A04b1cA14834A43f5dE4533eBDDB5CC8"
    symbol: USDC.e
    decimals: 6
