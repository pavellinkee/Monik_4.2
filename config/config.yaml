routes:
  # Покупка и продажа у одного агрегатора. Архитектура это допускает при
  # явном разрешении (02_LEVEL1_SCANNER.md §18); основной моделью остаётся
  # кросс-провайдерный арбитраж. Включено для наблюдения: направление
  # почти наверняка убыточно — вход и выход идут по одной кривой
  # ликвидности, — но проверяется это замером, а не рассуждением.
  allow_same_provider: true
  allowed_pairs: []
  max_route_steps: 4

scanner:
  # Сканируемые сети и базовый токен каждой из них заданы в разделе
  # networks: сканируются все включённые сети, каждая своим циклом.
  # Суммы задаются только конфигурацией (01_PROJECT_REQUIREMENTS.md §22).
  # Суммы, которыми Level 2 проверяет найденную возможность. Их число
  # произвольно и на стоимость поиска не влияет.
  amounts: ["50", "100", "300", "500"]

  # Режимы сканирования. Каждый — именованный проход Level 1 со своим
  # темпом и своей планкой (the_main_rules.md, правило 10). Уровни при
  # этом не меняются: Level 1 ищет, Level 2 подтверждает.
  modes:
    # ur — основной проход: весь набор токенов, все включённые
    # агрегаторы. Сейчас выключен по решению оператора.
    ur:
      enabled: false
      interval_seconds: 300
    # fest — частый проход по стейблкоинам. Набор определяется меткой
    # usd_stable, поэтому EURe в него не входит: он привязан к евро и
    # интересен расхождением EUR/USD, а не отклонением от паритета.
    # Состав агрегаторов задан у них самих (providers[].modes).
    fest:
      # Остановлен по решению оператора 17.09.
      enabled: false
      interval_seconds: 30
    # ann — торговый проход (the_main_rules.md, правило 11). Сканирует все
    # суммы сразу, выбирает лучшую находку по заработку в USDT и исполняет
    # сделку сам. Пока подсистемы исполнения нет, его находки только
    # записываются в журнал — это сухой прогон режима.
    ann:
      enabled: true
      # Тридцать секунд по решению оператора 19.09. Прежние десять
      # стоили CoW Swap 1,2 запроса в секунду без перерыва, и CloudFront
      # закрыл доступ по частоте через восемнадцать минут работы.
      # Проверенная безопасной частота — 0,2 запроса в секунду
      # (измерение 18.09: 2 ч 14 мин, 1557 запросов, ноль отказов).
      interval_seconds: 30
      # Свой срок прохода: общий (25 с) в такой интервал не укладывается,
      # а понижать его для всех нельзя — медленный обход всего набора
      # токенов в режиме ur столько не успевает.
      scan_timeout_seconds: 10
      # Свои суммы: торговый проход ограничен остатком счёта, тогда как
      # суммы проверки Level 2 — вопрос анализа и от денег на кошельке
      # не зависят. Заданы оператором 17.09.
      amounts: ["50", "100"]
      # Сети режима перечислены обе; работающая отмечена true. Включение
      # подготовленной сети — правка одного слова.
      #
      # 18.09 по решению оператора торговый проход переведён обратно в
      # Polygon: у KyberSwap в Arbitrum круг обходился вдвое дороже
      # ($0,033 против $0,018 у Uniswap) и цена на паре USDT/DAI была
      # хуже. Arbitrum остаётся объявленным и включается одним словом.
      networks:
        polygon: true
        arbitrum: false

  level1:
    # Сумма поиска. Level 1 работает одной суммой: остальные Level 2
    # подставляет в уже найденную возможность.
    amount: "50"
    overlap_policy: skip
    # Таймаут прохода. Не может превышать интервал самого частого
    # включённого режима, иначе проходы накладывались бы по построению.
    scan_timeout_seconds: 25
    top_tokens: 30
    max_opportunities_per_scan: 50
    max_concurrent_requests: 8
    quote_max_age_seconds: 30
    # Срок, в течение которого возможность можно проверять. Поднят до
    # десяти минут, чтобы проверка пережила ручную остановку сканера: при
    # восстановлении просроченное задание отменяется, а не начинается
    # заново. Возраст возможности при этом считается по календарю —
    # время простоя из него не вычитается.
    opportunity_ttl_seconds: 600
    deduplication_window_seconds: 300

  level2:
    enabled: true
    max_parallel: 20              # CLAUDE.md §18
    queue_capacity: 200
    # Срок жизни задания Level 2. Совпадает со сроком возможности: если
    # возможность истечёт раньше, задание останется без предмета проверки.
    job_ttl_seconds: 600
    confirmation_timeout_seconds: 60
    max_attempts: 3
    quote_max_age_seconds: 15

profitability:
  threshold_metric: net_roi
  # Порог каждого режима. Один на оба уровня: Level 1 ищет и Level 2
  # подтверждает по одной планке (the_main_rules.md, правило 10).
  # Сравнение >=, ровно указанное значение проходит.
  thresholds:
    ur: "0.1"
    fest: "0.02"
    # 0,01 % по решению оператора 19.09. Порог — ожидание при входе
    # (правило 12): пройдя его, сделка открывается, а завершается любой
    # чистой прибылью не ниже денежного минимума выхода. Если сразу она
    # недостижима, сделка уходит в ожидание и проверяется каждые
    # trading.recheck_interval_seconds.
    ann: "0.01"

# Исполнение сделок режима ann. Отдельная подсистема со своим
# выключателем (the_main_rules.md, правило 11): режим может искать, не
# торгуя, — это сухой прогон.
trading:
  # Пока выключено: сделки не отправляются, находки только пишутся в
  # журнал. Ключ при этом читается — он нужен, чтобы видеть балансы.
  execution_enabled: true
  private_key: { env: "MONIK_TRADING_PRIVATE_KEY" }
  # Допуск проскальзывания. Это защита от завышенной котировки: если
  # реальный пул не даёт обещанного, сделка откатывается сетью, и мы
  # теряем газ вместо исполнения по плохому курсу.
  #
  # С 18.09 решение о сделке принимается по **обязательству** агрегатора,
  # а не по котировке, и допуск стал главной статьёй расхода: он вычитается
  # дважды, по разу на ногу. При 0,1 % круг обязан был бы давать 0,24 % на
  # сумме 50 — таких расхождений между стейблкоинами не бывает. При 0,01 %
  # на сумме 100 достаточно 0,041 %, что наблюдается.
  #
  # Цена узкого допуска — откаты, когда пул шевельнётся между сборкой и
  # включением в блок. Откат стоит только газа (в Arbitrum около $0,004) и
  # деньги не теряет: сделка просто не состоится.
  slippage_percent: "0.01"
  # Допуск ноги, исполняемой подписанным намерением. Ноль по решению
  # оператора 19.09: неисполненная заявка не стоит ничего — её просто не
  # возьмёт решатель, газ не тратится, позиция не открывается. Уступка
  # вычитается по разу на ногу, и при пороге в один базисный пункт та же
  # уступка на обеих ногах делала прибыльный круг невозможным.
  order_slippage_percent: "0"

  # Минимальная чистая прибыль для закрытия позиции, в базовом токене.
  # Чистая — за вычетом газа обеих ног: газ от суммы сделки не зависит и
  # на малых суммах решает исход.
  #
  # Первый порог действует на проверке сразу после покупки, второй — у
  # сделки, ушедшей в ожидание: деньги уже заперты в позиции, и выйти из
  # них выгоднее, чем ждать прежней прибыли. Заданы оператором 17.09.
  # Оба порога 0,005 по решению оператора 18.09: минимальная чистая
  # прибыль круга одна и не зависит от того, проверяется выход сразу
  # после покупки или позже. Правило 12 разрешает равенство — оно
  # означает «уступки нет».
  min_exit_profit: "0.005"
  min_exit_profit_waiting: "0.005"
  recheck_interval_seconds: 10
  receipt_timeout_seconds: 120
  receipt_poll_seconds: 2
  # Предельный срок ожидания выхода. По его истечении приходит
  # уведомление; позицию в убыток система не закрывает никогда.
  max_wait_notice_enabled: true
  max_wait_notice_seconds: 7200
  approve_unlimited: true
  # Отчёт раз в полчаса по решению оператора 19.09.
  report_enabled: true
  report_interval_seconds: 1800

fees:
  enabled: true
  refresh_on_startup: true
  refresh_interval_days: 1
  refresh_time: "02:00"
  freshness_seconds: 86400
  batch_enabled: true

# Gas и цены подключаются независимыми реализациями Provider (решение D-4).
gas:
  enabled: true
  # adapter_estimate — gas units из маршрута; rpc — цена газа из узла сети.
  # static используется только как явно настроенный fallback.
  # Порядок источников цены газа. quote — цена, пришедшая вместе с
  # котировкой агрегатора: лишнего запроса не требует, потому что
  # значение уже получено. rpc остаётся запасным на случай провайдера,
  # который цену не сообщает. adapter_estimate — расход газа из маршрута.
  sources: [quote, adapter_estimate, rpc]
  freshness_seconds: 60
  request_timeout_seconds: 5.0
  # static_wei_per_gas:
  #   polygon: 120000000000

  # Поправка к оценке расхода газа из котировки. Агрегатор оценивает голый
  # обмен по одному лучшему пути, а платим мы за реальный вызов роутера —
  # с разрешениями, обёртками и маршрутом, который на исполнении может
  # разойтись на несколько пулов.
  #
  # Значение измерено 18.09 в обеих сетях одинаково: стоимость круга по
  # пределам газа собранных транзакций против суммы долларовых оценок из
  # котировок дала 1,312 в Polygon и 1,294 в Arbitrum. Взято 1,3.
  #
  # Фактический расход исполненной сделки бывает заметно выше: на #T1
  # маршрут продажи разошёлся на два пула, и вышло втрое против оценки.
  # Такие случаи ловит не этот множитель, а точная проверка стоимости
  # перед самой сделкой — она считает по пределам газа уже собранных
  # транзакций обеих ног.
  quote_estimate_multiplier: "1.0"
  quote_estimate_multipliers:
    uniswap: "1.3"

  # Самокалибровка: обещанное приходит с котировкой, фактическое — с
  # квитанцией, которую подсистема исполнения запрашивает в любом случае.
  # Поправка поэтому не стоит ни одного дополнительного обращения и сама
  # следует за изменением маршрутов.
  calibration:
    enabled: true
    # Одна сделка — не статистика: до пяти замеров действует значение выше.
    min_samples: 5
    # Предел накопленной истории. По его достижении накопленное
    # уполовинивается, иначе давние замеры навсегда перевешивали бы свежие.
    max_samples: 100

prices:
  enabled: true
  sources: [aggregator_quote]
  freshness_seconds: 300
  request_timeout_seconds: 5.0

resources:
  global_max_concurrent_requests: 32
  provider_min_interval_seconds: 0.2
  queue_capacity: 1000
  queue_wait_timeout_seconds: 30.0
  default_request_timeout_seconds: 10.0
  lease_timeout_seconds: 60.0
  deduplicate_in_flight: true
  retry:
    max_attempts: 3               # CLAUDE.md §32
    initial_delay_seconds: 0.5
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    jitter_ratio: 0.2
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout_seconds: 30.0
    half_open_max_calls: 1
    success_threshold: 2

scheduler:
  enabled: true
  tasks:
    # По задаче на режим. Период каждой берётся из scanner.modes и здесь
    # не дублируется: параметром управляют в одном месте. Указанное здесь
    # значение, расходящееся с настройкой режима, остановит старт.
    scan_ur:
      mode: interval
      overlap_policy: skip
    scan_fest:
      mode: interval
      overlap_policy: skip
    fee_refresh:
      mode: daily
      time: "02:00"
      timezone: "Europe/Lisbon"
      interval_days: 1
    capability_refresh:
      mode: startup
    # Напоминание о доступных, но не установленных обновлениях. Ничего
    # не устанавливает: автоматически ставятся только обновления
    # безопасности, остальные ждут решения оператора.
    system_updates:
      mode: daily
      time: "09:00"
      timezone: "Europe/Lisbon"
      interval_days: 1
    cleanup:
      mode: daily
      time: "03:30"
      timezone: "Europe/Lisbon"
      interval_days: 1

health:
  enabled: true
  check_interval_seconds: 60
  provider_degraded_threshold: 2     # порог перехода в DEGRADED
  provider_failure_threshold: 4      # порог перехода в UNAVAILABLE
  provider_recovery_threshold: 2     # гистерезис: порог восстановления
  worker_restart_limit: 3

notifications:
  enabled: true
  mode: A                         # A | B — влияет только на правила отправки
  language: ru
  decimal_places: 6
  queue_capacity: 500
  max_attempts: 5
  retry_initial_delay_seconds: 2.0
  retry_max_delay_seconds: 300.0
  deduplication_window_seconds: 3600
  show_calculation_version: false  # версия формулы в тексте уведомления
  # Значки уведомления о возможности. Значок агрегатора задан у самого
  # агрегатора, значок сети — у сети: свойство живёт там, где его владелец.
  emoji:
    pair: "💱"        # строка направления обмена
    best_roi: "⭐"     # сумма с наибольшим процентом доходности
    best_profit: "💎"  # сумма с наибольшей прибылью в базовом токене
    partial: "⚠️"      # сумма, не получившая подтверждения
    time: "⌚"        # время завершения проверки Level 2
  # Режим влияет ТОЛЬКО на правила отправки и не меняет Level 1 / Level 2.
  mode_a:
    send_confirmed: true
    send_partial: true
  mode_b:
    send_confirmed: true
    send_partial: true
  telegram:
    enabled: true
    bot_token: { env: "MONIK_TELEGRAM_BOT_TOKEN" }
    chat_id: { env: "MONIK_TELEGRAM_CHAT_ID" }
    api_base_url: "https://api.telegram.org"
    request_timeout_seconds: 10.0
    commands_enabled: true
    poll_interval_seconds: 2.0

database:
  # База вынесена за пределы каталога состояния: переход на следующую
  # версию не должен затрагивать историю. Каталог создаётся один раз и
  # принадлежит пользователю службы.
  path: "/var/lib/monik/monik.db"
  wal_enabled: true
  busy_timeout_seconds: 5.0
  integrity_check_on_startup: true
  cleanup_enabled: true
  retention:
    opportunities_days: 90
    jobs_days: 30
    notifications_days: 30
    scans_days: 14
    fee_snapshots_days: 30

logging:
  level: INFO
  directory: logs
  retention_days: 14

metrics:
  enabled: true
  collection_interval_seconds: 60
